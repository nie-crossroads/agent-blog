server:
  port: 8080
  servlet:
    context-path: /agent-blog/server
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: agent-blog
  config:
    import: optional:classpath:application-local.yml,optional:file:./application-local.yml
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:}
    username: ${BLOG_DB_USERNAME:}
    password: ${BLOG_DB_PASSWORD:}
  mail:
    host: smtp.qq.com
    port: 587
    username: ${BLOG_MAIL_USERNAME:}
    password: ${BLOG_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: smtp.qq.com
      mail.smtp.ssl.protocols: TLSv1.2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

blog:
  jwt:
    secret: ${BLOG_JWT_SECRET:}
    expire-hours: 24
  storage:
    # local | cos | qiniu
    type: ${BLOG_STORAGE_TYPE:cos}
    prefix: agent-blog
  upload:
    dir: uploads
    url-prefix: /uploads
  cos:
    secret-id: ${BLOG_COS_SECRET_ID:}
    secret-key: ${BLOG_COS_SECRET_KEY:}
    bucket: ${BLOG_COS_BUCKET:}
    region: ${BLOG_COS_REGION:}
    cdn-domain: ${BLOG_COS_CDN_DOMAIN:}
  qiniu:
    access-key: ${BLOG_QINIU_ACCESS_KEY:}
    secret-key: ${BLOG_QINIU_SECRET_KEY:}
    bucket: ${BLOG_QINIU_BUCKET:}
    region: ${BLOG_QINIU_REGION:auto}
    cdn-domain: ${BLOG_QINIU_CDN_DOMAIN:}
  cors:
    origins: ${BLOG_CORS_ORIGINS:}
  site:
    title: ${BLOG_SITE_TITLE:}
    msg-avatar: ${BLOG_SITE_MSG_AVATAR:}
    site-url: ${BLOG_SITE_URL:}
  # 首次启动会把 admin 密码重置为下面的明文，便于本地登录；真实值放 application-local.yml
  admin:
    username: ${BLOG_ADMIN_USERNAME:}
    reset-password: ${BLOG_ADMIN_RESET_PASSWORD:}
  map:
    qq-key: ${BLOG_MAP_QQ_KEY:}
    ip-url: https://apis.map.qq.com/ws/location/v1/ip
  uapi:
    qq-info-key: ${BLOG_QQ_INFO_KEY:}
    qq-userinfo-url: https://tqapi.com/api/qqinfo/info
    qq-avatar-url: https://q1.qlogo.cn/g?b=qq&nk={qq}&s=100
